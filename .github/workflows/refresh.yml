name: Refresh live IPO data
on:
  schedule:
    - cron: "15 3-15 * * *"   # every hour, 08:45-20:45 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4
      - run: python scripts/refresh.py
      - name: Commit if changed
        run: |
          git config user.name "ayusha-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Update live IPO data" && git pull --rebase -q && git push; fi
