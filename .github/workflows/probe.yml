name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe; cd probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sL -A "$UA" -o live_gmp.html "https://www.investorgain.com/report/live-ipo-gmp/331/"
          curl -sL -A "$UA" -o live_sub.html "https://www.investorgain.com/report/ipo-subscription-live/333/ipo/"
          curl -sL -A "$UA" -o tracker.html "https://www.investorgain.com/report/ipo-gmp-performance-tracker/377/ipo/?year=2026"
          curl -sL -A "$UA" -o ipo_tonbo.html "https://www.investorgain.com/ipo/tonbo-imaging-india-ipo/2266/" 
          ls -la
      - run: |
          git config user.name "ayusha-bot"; git config user.email "actions@users.noreply.github.com"
          git add probe; git commit -m "probe pages"; git push
