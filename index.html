<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="A.Y.U.S.H.A. - listing-gain checker for Indian mainboard IPOs, built on a GMP model tested on 453 IPOs.">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px)}
.drv { display: grid; gap: 7px; }
.drv-row { display: grid; grid-template-columns: minmax(0, 1fr) 7.5rem 3.6rem; gap: 8px; align-items: center; font-size: 0.82rem; }
.drv-bar { position: relative; height: 10px; background: var(--line); border-radius: 5px; }
.drv-bar .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.drv-bar .f { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
.drv-bar .f.pos { left: 50%; background: var(--up); }
.drv-bar .f.neg { right: 50%; background: var(--down); }
.drv-v { font-family: var(--f-num); text-align: right; }
.drv-total { border-top: 1px solid var(--line); padding-top: 7px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.74rem; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; color: var(--ink); background: var(--bg); }
.chip.bad { color: var(--down); border-color: color-mix(in srgb, var(--down) 40%, var(--line)); }
.chip.good { color: var(--up); border-color: color-mix(in srgb, var(--up) 40%, var(--line)); }
details.more { border-top: 1px dashed var(--line); padding-top: 10px; }
details.more summary { cursor: pointer; font-size: 0.85rem; color: var(--accent); font-weight: 600; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more[open] summary { margin-bottom: 12px; }
.src { font-size: 0.75rem; color: var(--muted); }
.src a { color: inherit; }
</style>
<title>A.Y.U.S.H.A.</title>
<meta name="theme-color" content="#11204a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column mobile ticket stack, sticky header + bottom tab bar; widens to 2 columns on desktop */
:root {
  --bg: #f3f4f8; --surface: #ffffff; --ink: #121a33; --muted: #5d6680; --line: #dfe2ec;
  --brand: #11204a; --brand-ink: #ffffff; --accent: #e8590c;
  --up: #0b7a43; --up-bg: #e3f4ea; --down: #c0262d; --down-bg: #fbe6e6; --warn: #9a6200; --warn-bg: #fdf1d8;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1020; --surface: #141b31; --ink: #e9ecf6; --muted: #98a1bd; --line: #26304d;
  --brand: #0e1836; --brand-ink: #f2f4fb; --accent: #ff8a3d;
  --up: #3ecf84; --up-bg: #12301f; --down: #ff6b70; --down-bg: #3a1619; --warn: #f2b84b; --warn-bg: #352a10; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1020; --surface: #141b31; --ink: #e9ecf6; --muted: #98a1bd; --line: #26304d;
  --brand: #0e1836; --brand-ink: #f2f4fb; --accent: #ff8a3d;
  --up: #3ecf84; --up-bg: #12301f; --down: #ff6b70; --down-bg: #3a1619; --warn: #f2b84b; --warn-bg: #352a10; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--brand); color: var(--brand-ink);
  padding-block: 14px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 60rem; margin-inline: auto; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; letter-spacing: 0.08em; margin: 0; }
.logo span { color: var(--accent); }
.fresh { font-size: 0.78rem; opacity: 0.8; }
main { padding-block: 16px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 60rem; margin-inline: auto; display: grid; gap: 18px; }
.view[hidden] { display: none !important; }
.sec-h { font-family: var(--f-display); font-weight: 500; font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; display: flex; gap: 8px; align-items: center; }
.sec-h .n { font-family: var(--f-num); font-size: 0.78rem; background: var(--line); color: var(--ink); border-radius: 999px; padding: 1px 8px; letter-spacing: 0; }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-width: 0; }
.card-btn { all: unset; box-sizing: border-box; display: grid; gap: 10px; width: 100%; padding: 14px 16px; cursor: pointer; }
.card-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--r); }
.row1 { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.name { font-family: var(--f-display); font-weight: 700; font-size: 1.08rem; line-height: 1.2; text-wrap: balance; min-width: 0; }
.dates { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
.badge { flex: none; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.b-strong { background: var(--up-bg); color: var(--up); }
.b-mild { background: var(--warn-bg); color: var(--warn); }
.b-red { background: var(--down-bg); color: var(--down); }
.b-none { background: var(--line); color: var(--muted); }
.figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fig .k { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.fig .v { font-family: var(--f-num); font-size: 1rem; font-variant-numeric: tabular-nums; margin-top: 2px; }
.v.up { color: var(--up); } .v.down { color: var(--down); }
.detail { border-top: 1px dashed var(--line); padding: 14px 16px 16px; display: grid; gap: 14px; }
.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big .num { font-family: var(--f-display); font-weight: 700; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.big .sub { color: var(--muted); font-size: 0.85rem; }
.range { position: relative; height: 36px; margin-top: 4px; }
.range .axis { position: absolute; left: 0; right: 0; top: 14px; height: 6px; border-radius: 3px; background: var(--line); }
.range .band { position: absolute; top: 12px; height: 10px; border-radius: 5px; background: color-mix(in srgb, var(--up) 35%, transparent); }
.range .zero { position: absolute; top: 6px; width: 2px; height: 22px; background: var(--muted); }
.range .pt { position: absolute; top: 9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.range .lab { position: absolute; top: 26px; font-size: 0.68rem; color: var(--muted); font-family: var(--f-num); transform: translateX(-50%); white-space: nowrap; }
.kv { display: grid; gap: 8px; }
.kv div { display: flex; justify-content: space-between; gap: 12px; font-size: 0.88rem; border-bottom: 1px solid var(--line); padding-bottom: 7px; }
.kv div:last-child { border-bottom: 0; }
.kv span:last-child { font-family: var(--f-num); text-align: right; }
.subs { display: grid; gap: 6px; }
.sb { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) 4.4rem; gap: 8px; align-items: center; font-size: 0.8rem; }
.sb .t { height: 8px; background: var(--line); border-radius: 4px; position: relative; overflow: hidden; }
.sb .f { position: absolute; inset: 0 auto 0 0; background: var(--brand); border-radius: 4px; }
:root:not([data-theme="light"]) .sb .f { background: var(--accent); }
:root[data-theme="light"] .sb .f { background: var(--brand); }
.sb .x { font-family: var(--f-num); text-align: right; }
.note { font-size: 0.78rem; color: var(--muted); line-height: 1.5; margin: 0; }
.note.warn { color: var(--warn); }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 28px 18px; text-align: center; color: var(--muted); line-height: 1.55; }
form.calc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fields .full { grid-column: 1 / -1; }
label { display: grid; gap: 5px; font-size: 0.8rem; color: var(--muted); }
input { font: inherit; font-family: var(--f-num); font-size: 1rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; min-width: 0; }
input[type=text] { font-family: var(--f-body); }
input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.btn { font: inherit; font-weight: 600; background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 12px; padding: 13px 16px; cursor: pointer; }
:root:not([data-theme="light"]) .btn { background: var(--accent); color: #1a0d03; }
:root[data-theme="light"] .btn { background: var(--brand); color: var(--brand-ink); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.prose { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; line-height: 1.6; font-size: 0.92rem; }
.prose h2 { font-family: var(--f-display); font-size: 1.15rem; margin: 0; }
.prose p, .prose ul { margin: 0; }
.prose ul { padding-left: 1.1rem; display: grid; gap: 6px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 30rem; margin-inline: auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { all: unset; text-align: center; padding: 10px 4px 12px; font-size: 0.78rem; color: var(--muted); cursor: pointer; display: grid; justify-items: center; gap: 3px; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 8px; }
@media (prefers-reduced-motion: no-preference) { .detail { animation: open .22s ease-out; } @keyframes open { from { opacity: 0; transform: translateY(-4px); } } }
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 class="logo">A.Y.U.S.H.A<span>.</span></h1>
    <span class="fresh" id="fresh">Loading…</span>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="view" id="v-live" aria-label="Live IPOs"><div id="live-body" class="wrap"></div></section>

    <section class="view" id="v-check" hidden aria-label="Check any IPO">
      <form class="calc" id="calc" novalidate>
        <div class="fields">
          <label class="full" for="f-name">IPO name<input id="f-name" type="text" value="My IPO" autocomplete="off"></label>
          <label for="f-price">Issue price (₹)<input id="f-price" type="number" inputmode="decimal" step="any" value="700"></label>
          <label for="f-gmp">GMP (₹)<input id="f-gmp" type="number" inputmode="decimal" step="any" value="505"></label>
          <label for="f-total">Total subscription (x)<input id="f-total" type="number" inputmode="decimal" step="any" placeholder="optional"></label>
          <label for="f-qib">QIB (x)<input id="f-qib" type="number" inputmode="decimal" step="any" placeholder="optional"></label>
          <label for="f-nii">NII (x)<input id="f-nii" type="number" inputmode="decimal" step="any" placeholder="optional"></label>
          <label for="f-rii">Retail (x)<input id="f-rii" type="number" inputmode="decimal" step="any" placeholder="optional"></label>
        </div>
        <details class="more">
          <summary>Add company details (optional, improves the score)</summary>
          <div class="fields">
            <label for="f-size">Issue size (₹ cr)<input id="f-size" type="number" inputmode="decimal" step="any"></label>
            <label for="f-fresh">of which fresh issue (₹ cr)<input id="f-fresh" type="number" inputmode="decimal" step="any"></label>
            <label for="f-pe">P/E (x)<input id="f-pe" type="number" inputmode="decimal" step="any"></label>
            <label for="f-pb">Price to book (x)<input id="f-pb" type="number" inputmode="decimal" step="any"></label>
            <label for="f-mcap">Market cap (₹ cr)<input id="f-mcap" type="number" inputmode="decimal" step="any"></label>
            <label for="f-age">Company age (years)<input id="f-age" type="number" inputmode="decimal" step="any"></label>
            <label for="f-rev0">Revenue, latest FY (₹ cr)<input id="f-rev0" type="number" inputmode="decimal" step="any"></label>
            <label for="f-rev1">Revenue, previous FY (₹ cr)<input id="f-rev1" type="number" inputmode="decimal" step="any"></label>
            <label for="f-pat0">Net profit, latest FY (₹ cr)<input id="f-pat0" type="number" inputmode="decimal" step="any"></label>
            <label for="f-pat1">Net profit, previous FY (₹ cr)<input id="f-pat1" type="number" inputmode="decimal" step="any"></label>
            <label for="f-nw">Net worth (₹ cr)<input id="f-nw" type="number" inputmode="decimal" step="any"></label>
            <label for="f-debt">Total borrowing (₹ cr)<input id="f-debt" type="number" inputmode="decimal" step="any"></label>
            <label for="f-ppre">Promoter holding pre-IPO (%)<input id="f-ppre" type="number" inputmode="decimal" step="any"></label>
            <label for="f-ppost">Promoter holding post-IPO (%)<input id="f-ppost" type="number" inputmode="decimal" step="any"></label>
          </div>
          <p class="note">Market conditions (NIFTY, Smallcap, VIX) and recent IPO listings are filled in automatically from the latest data.</p>
        </details>
        <button class="btn" type="submit">Score this IPO</button>
      </form>
      <div id="calc-out"></div>
    </section>

    <section class="view" id="v-about" hidden aria-label="How it works">
      <div class="prose" id="about"></div>
    </section>
  </div>
</main>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button class="tab" data-v="live" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/></svg>Live IPOs</button>
    <button class="tab" data-v="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h3M13 12h3M8 16h3M13 16h3"/></svg>Check IPO</button>
    <button class="tab" data-v="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>How it works</button>
  </div>
</nav>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
