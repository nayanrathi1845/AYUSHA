<!doctype html>
<html lang="en">
<head>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="description" content="A.Y.U.S.H.A. - listing-gain checker for Indian mainboard IPOs, built on a GMP model tested on 453 IPOs.">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>A.Y.U.S.H.A.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-column mobile ticket stack, sticky header + bottom tab bar; widens to 2 columns on desktop */
:root {
  --bg: #f3f4f8; --surface: #ffffff; --ink: #121a33; --muted: #5d6680; --line: #dfe2ec;
  --brand: #11204a; --brand-ink: #ffffff; --accent: #e8590c;
  --up: #0b7a43; --up-bg: #e3f4ea; --down: #c0262d; --down-bg: #fbe6e6; --warn: #9a6200; --warn-bg: #fdf1d8;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1020; --surface: #141b31; --ink: #e9ecf6; --muted: #98a1bd; --line: #26304d;
  --brand: #0e1836; --brand-ink: #f2f4fb; --accent: #ff8a3d;
  --up: #3ecf84; --up-bg: #12301f; --down: #ff6b70; --down-bg: #3a1619; --warn: #f2b84b; --warn-bg: #352a10; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1020; --surface: #141b31; --ink: #e9ecf6; --muted: #98a1bd; --line: #26304d;
  --brand: #0e1836; --brand-ink: #f2f4fb; --accent: #ff8a3d;
  --up: #3ecf84; --up-bg: #12301f; --down: #ff6b70; --down-bg: #3a1619; --warn: #f2b84b; --warn-bg: #352a10; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--brand); color: var(--brand-ink);
  padding-block: 14px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 60rem; margin-inline: auto; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; letter-spacing: 0.08em; margin: 0; }
.logo span { color: var(--accent); }
.fresh { font-size: 0.78rem; opacity: 0.8; }
main { padding-block: 16px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 60rem; margin-inline: auto; display: grid; gap: 18px; }
.view[hidden] { display: none !important; }
.sec-h { font-family: var(--f-display); font-weight: 500; font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; display: flex; gap: 8px; align-items: center; }
.sec-h .n { font-family: var(--f-num); font-size: 0.78rem; background: var(--line); color: var(--ink); border-radius: 999px; padding: 1px 8px; letter-spacing: 0; }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-width: 0; }
.card-btn { all: unset; box-sizing: border-box; display: grid; gap: 10px; width: 100%; padding: 14px 16px; cursor: pointer; }
.card-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--r); }
.row1 { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.name { font-family: var(--f-display); font-weight: 700; font-size: 1.08rem; line-height: 1.2; text-wrap: balance; min-width: 0; }
.dates { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
.badge { flex: none; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.b-strong { background: var(--up-bg); color: var(--up); }
.b-mild { background: var(--warn-bg); color: var(--warn); }
.b-red { background: var(--down-bg); color: var(--down); }
.b-none { background: var(--line); color: var(--muted); }
.figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fig .k { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.fig .v { font-family: var(--f-num); font-size: 1rem; font-variant-numeric: tabular-nums; margin-top: 2px; }
.v.up { color: var(--up); } .v.down { color: var(--down); }
.detail { border-top: 1px dashed var(--line); padding: 14px 16px 16px; display: grid; gap: 14px; }
.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big .num { font-family: var(--f-display); font-weight: 700; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.big .sub { color: var(--muted); font-size: 0.85rem; }
.range { position: relative; height: 36px; margin-top: 4px; }
.range .axis { position: absolute; left: 0; right: 0; top: 14px; height: 6px; border-radius: 3px; background: var(--line); }
.range .band { position: absolute; top: 12px; height: 10px; border-radius: 5px; background: color-mix(in srgb, var(--up) 35%, transparent); }
.range .zero { position: absolute; top: 6px; width: 2px; height: 22px; background: var(--muted); }
.range .pt { position: absolute; top: 9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.range .lab { position: absolute; top: 26px; font-size: 0.68rem; color: var(--muted); font-family: var(--f-num); transform: translateX(-50%); white-space: nowrap; }
.kv { display: grid; gap: 8px; }
.kv div { display: flex; justify-content: space-between; gap: 12px; font-size: 0.88rem; border-bottom: 1px solid var(--line); padding-bottom: 7px; }
.kv div:last-child { border-bottom: 0; }
.kv span:last-child { font-family: var(--f-num); text-align: right; }
.subs { display: grid; gap: 6px; }
.sb { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) 4.4rem; gap: 8px; align-items: center; font-size: 0.8rem; }
.sb .t { height: 8px; background: var(--line); border-radius: 4px; position: relative; overflow: hidden; }
.sb .f { position: absolute; inset: 0 auto 0 0; background: var(--brand); border-radius: 4px; }
:root:not([data-theme="light"]) .sb .f { background: var(--accent); }
:root[data-theme="light"] .sb .f { background: var(--brand); }
.sb .x { font-family: var(--f-num); text-align: right; }
.note { font-size: 0.78rem; color: var(--muted); line-height: 1.5; margin: 0; }
.note.warn { color: var(--warn); }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 28px 18px; text-align: center; color: var(--muted); line-height: 1.55; }
form.calc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fields .full { grid-column: 1 / -1; }
label { display: grid; gap: 5px; font-size: 0.8rem; color: var(--muted); }
input { font: inherit; font-family: var(--f-num); font-size: 1rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; min-width: 0; }
input[type=text] { font-family: var(--f-body); }
input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.btn { font: inherit; font-weight: 600; background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 12px; padding: 13px 16px; cursor: pointer; }
:root:not([data-theme="light"]) .btn { background: var(--accent); color: #1a0d03; }
:root[data-theme="light"] .btn { background: var(--brand); color: var(--brand-ink); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.prose { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; line-height: 1.6; font-size: 0.92rem; }
.prose h2 { font-family: var(--f-display); font-size: 1.15rem; margin: 0; }
.prose p, .prose ul { margin: 0; }
.prose ul { padding-left: 1.1rem; display: grid; gap: 6px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 30rem; margin-inline: auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { all: unset; text-align: center; padding: 10px 4px 12px; font-size: 0.78rem; color: var(--muted); cursor: pointer; display: grid; justify-items: center; gap: 3px; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 8px; }
@media (prefers-reduced-motion: no-preference) { .detail { animation: open .22s ease-out; } @keyframes open { from { opacity: 0; transform: translateY(-4px); } } }
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 class="logo">A.Y.U.S.H.A<span>.</span></h1>
    <span class="fresh" id="fresh">Connecting…</span>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="view" id="v-live" aria-label="Live IPOs"><div id="live-body" class="wrap"></div></section>

    <section class="view" id="v-check" hidden aria-label="Check any IPO">
      <form class="calc" id="calc" novalidate>
        <div class="fields">
          <label class="full" for="f-name">IPO name<input id="f-name" type="text" value="My IPO" autocomplete="off"></label>
          <label for="f-price">Issue price (₹)<input id="f-price" type="number" inputmode="decimal" step="any" value="700" required></label>
          <label for="f-gmp">GMP (₹)<input id="f-gmp" type="number" inputmode="decimal" step="any" value="505" required></label>
          <label for="f-total">Total subscription (x)<input id="f-total" type="number" inputmode="decimal" step="any" placeholder="optional"></label>
          <label for="f-qib">QIB (x)<input id="f-qib" type="number" inputmode="decimal" step="any" placeholder="optional"></label>
          <label for="f-nii">NII (x)<input id="f-nii" type="number" inputmode="decimal" step="any" placeholder="optional"></label>
          <label for="f-rii">Retail (x)<input id="f-rii" type="number" inputmode="decimal" step="any" placeholder="optional"></label>
        </div>
        <button class="btn" type="submit">Score this IPO</button>
      </form>
      <div id="calc-out"></div>
    </section>

    <section class="view" id="v-about" hidden aria-label="How it works">
      <div class="prose" id="about"></div>
    </section>
  </div>
</main>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button class="tab" data-v="live" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/></svg>Live IPOs</button>
    <button class="tab" data-v="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h3M13 12h3M8 16h3M13 16h3"/></svg>Check IPO</button>
    <button class="tab" data-v="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>How it works</button>
  </div>
</nav>

const H = MODEL.history.map(([g, o, c, s]) => ({ g, o, c, s }));
const qtl = (a, p) => { const s = [...a].sort((x, y) => x - y); const i = (s.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i); return s[lo] + (s[hi] - s[lo]) * (i - lo); };
const median = (a) => qtl(a, 0.5);

function score(ipo) {
  const price = +ipo.price, gmpPct = ipo.gmp_pct != null ? +ipo.gmp_pct : (+ipo.gmp / price) * 100;
  if (!(price > 0) || !isFinite(gmpPct)) return null;
  let peers = H.filter((h) => Math.abs(h.g - gmpPct) <= 7.5);
  if (peers.length < 25) peers = [...H].sort((a, b) => Math.abs(a.g - gmpPct) - Math.abs(b.g - gmpPct)).slice(0, 25);
  const outs = peers.map((p) => gmpPct + (p.o - p.g));
  const closes = peers.filter((p) => p.c != null).map((p) => p.c - p.g);
  const pNeg = peers.filter((p) => p.o < 0).length / peers.length;
  const r = {
    price, gmpPct, peers: peers.length, gMin: Math.min(...peers.map((p) => p.g)), gMax: Math.max(...peers.map((p) => p.g)),
    pNeg, lo: qtl(outs, 0.1), hi: qtl(outs, 0.9), bias: median(peers.map((p) => p.o - p.g)),
    close: gmpPct + median(closes),
  };
  // estimate without GMP: median opening gain of the past IPOs with the closest total subscription
  if (ipo.sub_total != null && ipo.sub_total !== "" && isFinite(+ipo.sub_total)) {
    const ls = Math.log1p(Math.max(0, +ipo.sub_total));
    const near = H.filter((h) => h.s != null).sort((a, b) => Math.abs(Math.log1p(a.s) - ls) - Math.abs(Math.log1p(b.s) - ls)).slice(0, MODEL.official.k);
    r.official = median(near.map((h) => h.o));
  }
  r.verdict = pNeg >= 0.35 || gmpPct <= 0 ? ["Red flag", "b-red"] : (gmpPct >= 15 && pNeg < 0.08 ? ["Strong", "b-strong"] : ["Mild", "b-mild"]);
  return r;
}

const pc = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + "%";
const rs = (v) => "₹" + Math.round(v).toLocaleString("en-IN");
const xx = (v) => (v == null || v === "" || !isFinite(+v)) ? "–" : (+v).toFixed(2) + "x";
const cls = (v) => (v > 0 ? "up" : v < 0 ? "down" : "");
const el = (tag, c, txt) => { const e = document.createElement(tag); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };

function rangeBar(r) {
  const box = el("div", "range");
  const vals = [r.lo, r.hi, r.gmpPct, 0];
  let a = Math.min(...vals), b = Math.max(...vals); const pad = (b - a) * 0.12 || 5; a -= pad; b += pad;
  const X = (v) => ((v - a) / (b - a)) * 100 + "%";
  box.append(el("div", "axis"));
  const band = el("div", "band"); band.style.left = X(r.lo); band.style.width = `calc(${X(r.hi)} - ${X(r.lo)})`; box.append(band);
  const z = el("div", "zero"); z.style.left = X(0); box.append(z);
  const p = el("div", "pt"); p.style.left = X(r.gmpPct); box.append(p);
  const l1 = el("div", "lab", pc(r.lo, 0)); l1.style.left = X(r.lo); const l2 = el("div", "lab", pc(r.hi, 0)); l2.style.left = X(r.hi);
  box.append(l1, l2);
  box.setAttribute("role", "img"); box.setAttribute("aria-label", `Likely range ${pc(r.lo, 0)} to ${pc(r.hi, 0)}`);
  return box;
}

function detailBlock(ipo, r) {
  const d = el("div", "detail");
  const big = el("div", "big");
  big.append(el("span", "num " + cls(r.gmpPct), pc(r.gmpPct)), el("span", "sub", `expected listing gain · about ${rs(r.price * (1 + r.gmpPct / 100))} at open`));
  d.append(big);
  d.append(el("p", "note", `What happened to ${r.peers} past IPOs with GMP ${r.gMin.toFixed(0)}% to ${r.gMax.toFixed(0)}%: 8 in 10 landed in this range (dot = GMP).`));
  d.append(rangeBar(r));
  const kv = el("div", "kv");
  const add = (k, v, c) => { const row = el("div"); row.append(el("span", "", k), el("span", c || "", v)); kv.append(row); };
  add("Chance of listing below issue price", Math.round(r.pNeg * 100) + "%", r.pNeg >= 0.35 ? "v down" : "");
  add("Listing-day close estimate", pc(r.close), "v " + cls(r.close));
  add("Similar IPOs vs their GMP (median)", (r.bias >= 0 ? "+" : "−") + Math.abs(r.bias).toFixed(1) + " pts");
  if (r.official != null) add("Estimate without GMP (from subscription)", pc(r.official), "v " + cls(r.official));
  d.append(kv);
  if (ipo.sub_total != null && ipo.sub_total !== "") {
    const subs = el("div", "subs");
    const cats = [["QIB", ipo.sub_qib], ["NII", ipo.sub_nii], ["Retail", ipo.sub_rii], ["Total", ipo.sub_total]].filter(([, v]) => v != null && v !== "");
    const mx = Math.max(10, ...cats.map(([, v]) => +v));
    cats.forEach(([k, v]) => {
      const sb = el("div", "sb"); const t = el("div", "t"); const f = el("div", "f"); f.style.width = Math.min(100, (Math.log1p(+v) / Math.log1p(mx)) * 100) + "%"; t.append(f);
      sb.append(el("span", "", k), t, el("span", "x", xx(v))); subs.append(sb);
    });
    d.append(el("div", "sec-h", "Subscription"), subs);
  }
  if (ipo.status === "Open") d.append(el("p", "note warn", "Bidding is still on. GMP and subscription usually change a lot by the close, so check again after it closes and on the evening before listing."));
  if (ipo.status === "Upcoming") d.append(el("p", "note warn", "Not open yet. Early GMP is a weak signal; the model was tested on the final GMP before listing."));
  d.append(el("p", "note", "Based on " + MODEL.stats.n + " past mainboard IPOs. Historical patterns, not investment advice."));
  return d;
}

// ---------- live list ----------
let LIVE = null, open = new Set();
const ORDER = [["Open", "Open for bidding"], ["Upcoming", "Upcoming"], ["Closed", "Closed, awaiting listing"]];

function renderLive() {
  const body = document.getElementById("live-body"); body.replaceChildren();
  const fresh = document.getElementById("fresh");
  if (!LIVE) {
    body.append(el("div", "empty", LIVE === null ? "Loading live IPOs…" : "No live IPO data yet. The first automatic fetch fills this list; meanwhile use Check IPO to score any issue by hand."));
    return;
  }
  const t = new Date(LIVE.updatedAt); const mins = Math.round((Date.now() - t) / 60000);
  fresh.textContent = "Updated " + (mins < 60 ? mins + " min ago" : mins < 1440 ? Math.round(mins / 60) + " h ago" : t.toLocaleDateString("en-IN", { day: "numeric", month: "short" }));
  const ipos = (LIVE.ipos || []).filter((i) => i && i.name);
  if (!ipos.length) { body.append(el("div", "empty", "No mainboard IPOs are open, upcoming or awaiting listing right now.")); return; }
  ORDER.forEach(([st, label]) => {
    const group = ipos.filter((i) => i.status === st); if (!group.length) return;
    const h = el("h2", "sec-h", label); h.append(el("span", "n", String(group.length))); body.append(h);
    const list = el("div", "list");
    group.forEach((ipo) => {
      const r = score(ipo); const card = el("article", "card");
      const btn = el("button", "card-btn"); btn.type = "button"; btn.setAttribute("aria-expanded", String(open.has(ipo.name)));
      const r1 = el("div", "row1"); const nm = el("div"); nm.append(el("div", "name", ipo.name), el("div", "dates", [ipo.open && "Opens " + ipo.open, ipo.close && "closes " + ipo.close, ipo.listing && "lists " + ipo.listing].filter(Boolean).join(" · ")));
      r1.append(nm, r ? el("span", "badge " + r.verdict[1], r.verdict[0]) : el("span", "badge b-none", "No GMP"));
      const figs = el("div", "figs");
      const fig = (k, v, c) => { const f = el("div", "fig"); f.append(el("div", "k", k), el("div", "v " + (c || ""), v)); figs.append(f); };
      fig("Price", ipo.price ? rs(+ipo.price) : "–");
      fig("GMP", r ? pc(r.gmpPct) : "–", r ? cls(r.gmpPct) : "");
      fig("Subscribed", xx(ipo.sub_total));
      btn.append(r1, figs); card.append(btn);
      if (r && open.has(ipo.name)) card.append(detailBlock(ipo, r));
      btn.addEventListener("click", () => { open.has(ipo.name) ? open.delete(ipo.name) : open.add(ipo.name); renderLive(); });
      list.append(card);
    });
    body.append(list);
  });
  body.append(el("p", "note", "Mainboard IPOs only. GMP and subscription from investorgain.com, refreshed automatically a few times a day."));
}

// ---------- check form ----------
document.getElementById("calc").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = (id) => document.getElementById(id).value.trim();
  const ipo = { name: v("f-name") || "This IPO", price: +v("f-price"), gmp: +v("f-gmp"), sub_total: v("f-total"), sub_qib: v("f-qib"), sub_nii: v("f-nii"), sub_rii: v("f-rii") };
  const out = document.getElementById("calc-out"); out.replaceChildren();
  const r = score(ipo);
  if (!r) { out.append(el("div", "empty", "Enter the issue price and GMP in rupees to get a score.")); return; }
  const card = el("article", "card"); const head = el("div", "card-btn"); head.style.cursor = "default";
  const r1 = el("div", "row1"); r1.append(el("div", "name", ipo.name), el("span", "badge " + r.verdict[1], r.verdict[0])); head.append(r1);
  card.append(head, detailBlock(ipo, r)); out.append(card);
});

// ---------- about ----------
(function about() {
  const a = document.getElementById("about"); const s = MODEL.stats;
  a.append(el("h2", "", "How A.Y.U.S.H.A. scores an IPO"));
  a.append(el("p", "", `It learned from ${s.n} Indian mainboard IPOs listed between ${new Date(s.from).toLocaleDateString("en-IN", { month: "short", year: "numeric" })} and ${new Date(s.to).toLocaleDateString("en-IN", { month: "short", year: "numeric" })}. In testing on IPOs it had never seen, the grey market premium (GMP) beat every model that added subscription, fundamentals or market data, so the score starts from GMP.`));
  const ul = el("ul");
  [
    `Expected listing gain: GMP as a percentage of the issue price. Average miss in testing: ${s.gmp_test_mae} percentage points.`,
    "Likely range and chance of a loss: what actually happened to past IPOs with a similar GMP.",
    `Close estimate: GMP adjusted by how similar IPOs moved between the open and the close (average miss about ${s.gmp_close_test_mae} points).`,
    `Estimate without GMP: the typical gain of past IPOs with similar total subscription, for when GMP is missing. Much less accurate (miss about ${MODEL.official.test_mae} points).`,
    "Strong: GMP of 15% or more and almost no similar IPO listed at a loss. Red flag: GMP at or below zero, or 35%+ of similar IPOs listed below issue price. Mild: everything in between.",
  ].forEach((t) => ul.append(el("li", "", t)));
  a.append(ul);
  a.append(el("p", "", "Live data: mainboard IPOs that are open, upcoming or closed but not yet listed, fetched from investorgain.com a few times a day. GMP is an unofficial grey-market quote and can be pushed around, especially for small issues."));
  a.append(el("p", "note", "Historical patterns only. Not investment advice."));
})();

// ---------- tabs ----------
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach((o) => o.removeAttribute("aria-current")); t.setAttribute("aria-current", "page");
  ["live", "check", "about"].forEach((v) => (document.getElementById("v-" + v).hidden = v !== t.dataset.v));
  window.scrollTo(0, 0);
}));

// ---------- data ----------
renderLive();
async function loadLive() {
  try {
    const res = await fetch("live.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    LIVE = await res.json();
  } catch (e) {
    if (LIVE === null) { LIVE = undefined; document.getElementById("fresh").textContent = "Couldn't load live IPOs"; }
  }
  renderLive();
}
loadLive();
setInterval(() => { if (LIVE) renderLive(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadLive(); });
</script>
